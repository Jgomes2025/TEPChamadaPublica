<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carta Convite – 3ª Chamada Pública – The Earthshot Prize 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&family=Orbitron:wght@700;900&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#e6c36a;--gold2:#fbe9ad;--gold3:#a9802f;--mint:#62f0bf;--river:#53d6e8;--ink:#eef5f1;--mute:#a7c4b8;
  --line:rgba(230,195,106,.28);--card:rgba(4,26,18,.72);--disp:"Orbitron","Noto Sans JP",sans-serif;--body:"Exo 2","Noto Sans JP",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#020806;scroll-behavior:smooth}
body{font-family:var(--body);color:var(--ink);font-size:16px;line-height:1.55;min-height:100vh;overflow-x:hidden;
  background:
   radial-gradient(80% 40% at 50% 0%, rgba(230,195,106,.26), transparent 70%),
   radial-gradient(50% 30% at 90% 55%, rgba(83,214,232,.07), transparent 70%),
   linear-gradient(180deg,#03100b 0%,#062619 35%,#04180f 75%,#020806 100%)}
a{color:var(--mint);text-decoration:none}
a:hover{text-decoration:underline}
b,strong{font-weight:700;color:#fff}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px;position:relative;z-index:2}
:lang(ja) .ls{letter-spacing:.06em!important}
:lang(ja) .lead,:lang(ja) .role,:lang(ja) .next,:lang(ja) .panel p,:lang(ja) .it p,:lang(ja) ul.chk li,:lang(ja) .warn{text-align:left;text-align-last:auto}

/* top bar */
.bar{position:sticky;top:0;z-index:20;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);background:rgba(2,10,7,.72);border-bottom:1px solid rgba(230,195,106,.18)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--gold2);white-space:nowrap}
.brand img{width:34px;height:34px;border-radius:6px;box-shadow:0 0 0 1px rgba(230,195,106,.5)}
.langs{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid rgba(230,195,106,.25)}
.langs a{font-family:var(--body);font-weight:700;font-size:13px;color:var(--mute);padding:6px 12px;border-radius:999px;text-decoration:none;transition:.2s}
.langs a:hover{color:#fff}
.langs a[aria-current=true]{color:#241a05;background:linear-gradient(180deg,var(--gold2),var(--gold));box-shadow:0 0 12px rgba(230,195,106,.45)}

/* hero */
.hero{position:relative;text-align:center;padding:56px 0 40px;overflow:hidden}
.beam{position:absolute;top:-80px;width:260px;height:640px;background:linear-gradient(180deg,rgba(251,233,173,.22),rgba(251,233,173,0) 85%);filter:blur(18px);pointer-events:none}
.beam.l{left:calc(50% - 470px);transform:rotate(-22deg)} .beam.r{right:calc(50% - 470px);transform:rotate(22deg)}
.fronds{position:absolute;top:0;width:min(34vw,320px);opacity:.85;pointer-events:none;z-index:0}
.fronds.l{left:0} .fronds.r{right:0;transform:scaleX(-1)}
.logos{display:flex;justify-content:center;gap:18px;margin-bottom:22px}
.logos img{width:76px;height:76px;border-radius:10px;box-shadow:0 0 0 1px rgba(230,195,106,.6),0 0 24px rgba(230,195,106,.3)}
.logos img.ufam{border-radius:50%;background:#fff;padding:3px}
.eyebrow{font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.32em;color:var(--mint)}
.title{display:flex;align-items:center;justify-content:center;gap:6px;margin:14px 0 12px}
.title img{width:clamp(34px,7vw,64px)}
h1{font-family:"Orbitron",sans-serif;font-weight:900;font-size:clamp(28px,6.4vw,62px);line-height:1.05;letter-spacing:.05em;
  background:linear-gradient(180deg,#fffbe8 0%,var(--gold2) 30%,var(--gold) 60%,var(--gold3) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(230,195,106,.35))}
.tag{font-size:clamp(16px,2.4vw,21px);color:var(--gold2)}
.tag em{font-style:normal;color:#fff;font-weight:700}
.date{margin-top:6px;font-size:13px;color:var(--mute);letter-spacing:.16em}
.ctas{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--body);font-weight:700;font-size:15px;padding:13px 22px;border-radius:999px;border:1px solid transparent;cursor:pointer;text-decoration:none!important;transition:transform .15s, box-shadow .2s}
.btn:hover{transform:translateY(-1px)}
.btn.gold{color:#241a05;background:linear-gradient(180deg,var(--gold2),var(--gold));box-shadow:0 0 24px rgba(230,195,106,.45)}
.btn.ghost{color:var(--gold2);background:rgba(230,195,106,.06);border-color:rgba(230,195,106,.5)}
.btn svg{width:18px;height:18px}
.stage{height:3px;max-width:820px;margin:38px auto 0;border-radius:3px;background:linear-gradient(90deg,transparent,var(--gold3),var(--gold2),var(--gold3),transparent);box-shadow:0 0 16px rgba(230,195,106,.6)}

section{padding:36px 0}
.lead{max-width:820px;margin:0 auto;text-align:justify;text-align-last:center;font-size:clamp(16px,2vw,19px)}
.stats{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:14px;margin-top:26px}
.stat{background:linear-gradient(180deg,rgba(230,195,106,.13),rgba(230,195,106,.03));border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center}
.stat .n{font-family:var(--body);font-weight:700;font-size:clamp(28px,4vw,40px);line-height:1.1;color:var(--gold2);text-shadow:0 0 14px rgba(230,195,106,.45)}
.stat .l{font-size:14px;color:var(--mute)}

h2{font-family:var(--disp);font-weight:700;font-size:clamp(15px,2vw,18px);letter-spacing:.16em;color:var(--gold2)}
h2 small{display:block;font-family:var(--body);font-weight:600;font-size:12px;letter-spacing:.16em;color:var(--mint);margin-bottom:4px}
.center{text-align:center}
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;position:relative;margin:26px 0 10px}
.stages:before{content:"";position:absolute;left:10%;right:10%;top:22px;height:1px;background:linear-gradient(90deg,var(--gold),var(--mint),var(--river));opacity:.7}
.st{text-align:center;position:relative}
.st .dot{width:44px;height:44px;margin:0 auto 8px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:"Orbitron";font-weight:700;font-size:13px;color:var(--mint);background:#05201a;border:1px solid var(--mint)}
.st.on .dot{background:radial-gradient(circle at 35% 30%,#fffbe8,var(--gold) 55%,var(--gold3));color:#241a05;border-color:var(--gold2);box-shadow:0 0 22px rgba(230,195,106,.8);animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 34px rgba(230,195,106,1)}}
.st .t{font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.1em}
.st.on .t,.st .h{color:var(--gold2)}
.st .h{font-size:11px;letter-spacing:.06em}
.role{max-width:860px;margin:14px auto 0;color:var(--mute);text-align:justify;text-align-last:center}

.cols{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.25fr);gap:18px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;position:relative}
.panel:before{content:"";position:absolute;left:24px;right:24px;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--gold2),transparent)}
.panel h2{margin-bottom:14px}
.panel p{text-align:justify}
ul.chk{list-style:none;margin:12px 0}
ul.chk li{padding-left:22px;position:relative;margin-bottom:6px;text-align:justify}
ul.chk li:before{content:"";position:absolute;left:2px;top:8px;width:10px;height:10px;border-radius:50% 0;transform:rotate(-45deg);background:var(--mint);box-shadow:0 0 8px var(--mint)}
.areas{display:flex;flex-direction:column;gap:8px;margin:8px 0 16px}
.area{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;background:rgba(0,0,0,.3);border:1px solid rgba(98,240,191,.16);font-weight:600;transition:border-color .2s,transform .2s}
.area:hover{border-color:rgba(230,195,106,.6);transform:translateX(3px)}
.area svg{width:22px;height:22px;flex:none}
.warn{border-left:4px solid var(--gold);padding:10px 14px;background:rgba(230,195,106,.09);border-radius:0 10px 10px 0;text-align:justify;font-size:15px}
.warn b{color:var(--gold2)}

.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,var(--mint),var(--river),var(--gold))}
.it{position:relative;margin-bottom:18px}
.it:last-child{margin-bottom:0}
.it:before{content:"";position:absolute;left:-25px;top:6px;width:14px;height:14px;border-radius:50%;background:#03140d;border:2px solid var(--mint);box-shadow:0 0 8px rgba(98,240,191,.6)}
.it.res:before{border-color:var(--gold);background:var(--gold);box-shadow:0 0 10px var(--gold)}
.it .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.it .tt{font-weight:700;color:#fff;font-size:17px}
.it.res .tt{color:var(--gold2)}
.it .tt span{font-family:"Orbitron";font-size:12px;letter-spacing:.12em;color:var(--mint);margin-right:8px}
.pill{flex:none;font-weight:700;font-size:13px;color:#241a05;background:linear-gradient(180deg,var(--gold2),var(--gold));padding:3px 12px;border-radius:999px;white-space:nowrap;box-shadow:0 0 10px rgba(230,195,106,.35)}
.it p{color:#d3e6de;margin-top:4px;text-align:justify;font-size:15px}
.zoom{margin-top:10px;padding:12px 14px;border-radius:12px;background:rgba(83,214,232,.08);border:1px solid rgba(83,214,232,.32);display:grid;gap:8px}
.zrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px}
.zrow .k{color:var(--river);font-weight:700;min-width:96px}
.zrow code{font-family:var(--body);color:#fff}
.copy{margin-left:auto;font:600 12px var(--body);color:var(--river);background:transparent;border:1px solid rgba(83,214,232,.5);border-radius:999px;padding:3px 10px;cursor:pointer}
.copy.ok{color:#041b14;background:var(--mint);border-color:var(--mint)}
.zoom .btn{justify-self:start;padding:8px 16px;font-size:14px}

.next{max-width:880px;margin:0 auto;text-align:justify;text-align-last:center;color:#d3e6de}
.thanks{margin-top:10px;text-align:center;color:var(--mute);font-size:15px}

/* footer */
footer{position:relative;margin-top:30px;padding-top:120px}
.forest{position:absolute;left:0;right:0;bottom:0;height:240px;background:url(assets/forest.svg) center bottom/cover no-repeat;z-index:0;opacity:.95}
footer:after{content:"";position:absolute;inset:auto 0 0 0;height:150px;background:linear-gradient(180deg,transparent,rgba(2,8,6,.85));z-index:1}
.sign{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;padding:20px 0 30px}
.who{color:#c4d9d0;text-shadow:0 1px 3px #000;font-size:15px}
.who b{font-size:17px}
.who .r{color:var(--gold2);font-weight:600}
.fcta{text-align:right;font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--mint)}
.fcta a{display:block;font-size:20px;color:var(--gold2);letter-spacing:.06em;margin-top:4px;text-shadow:0 0 12px rgba(230,195,106,.6)}

/* reveal */
.rv{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.st.on .dot{animation:none}}

@media (max-width:820px){
  .cols{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
  .stats .stat.big{grid-column:1/-1;order:-1}
  .brand span{display:none}
}
@media (max-width:520px){
  body{font-size:15px}
  .wrap{padding:0 14px}
  .langs a{padding:6px 9px;font-size:12px}
  .hero{padding-top:34px}
  .logos img{width:60px;height:60px}
  .eyebrow{font-size:10px;letter-spacing:.2em}
  .st .dot{width:36px;height:36px;font-size:11px}
  .stages:before{top:18px}
  .st .t{font-size:9px;letter-spacing:.04em}
  .st .h{font-size:9px}
  .panel{padding:18px}
  .fcta{text-align:left}
  .zrow .k{min-width:0}
}
</style>
</head>

<script>

const HTML_LANG = {pt:"pt-BR",es:"es",en:"en",ja:"ja"};
let cur = "pt";
function render(l){
  if(!T[l]) l="pt"; cur=l; const d=T[l];
  document.documentElement.lang = HTML_LANG[l];
  document.title = d.w_title;
  document.querySelectorAll("[data-k]").forEach(el=>{ const k=el.dataset.k; if(d[k]!==undefined) el.innerHTML=d[k]; });
  document.querySelectorAll(".langs a").forEach(a=>a.setAttribute("aria-current", a.dataset.l===l?"true":"false"));
  const f = FILES[l];
  const dl=document.getElementById("dl"); dl.href = pdfURL(f); dl.setAttribute("download", f);
}
function fromHash(){ const h=(location.hash||"").replace("#",""); return T[h]?h:(h==="doc"?cur:"pt"); }
window.addEventListener("hashchange",()=>{ const h=location.hash.replace("#",""); if(T[h]) render(h); });
render(fromHash());

// copy buttons
document.addEventListener("click", async e=>{
  const b=e.target.closest(".copy"); if(!b) return;
  try{ await navigator.clipboard.writeText(b.dataset.copy); b.textContent=T[cur].w_copied; b.classList.add("ok");
       setTimeout(()=>{b.textContent=T[cur].w_copy;b.classList.remove("ok")},1600);}catch(_){ }
});

// downloads
let downloads=null;
(async()=>{ try{ if(window.claude&&window.claude.use){ downloads = await window.claude.use("downloads"); } }catch(_){ downloads=null; } })();
document.getElementById("dl").addEventListener("click", async (ev)=>{
  if(!downloads) return; // normal browsers (GitHub Pages, own site): the link downloads the PDF itself
  ev.preventDefault(); const f=FILES[cur];
  try{ await downloads.save({filename:f, data: await pdfBlob(f)}); }
  catch(err){ if(!err || err.code!=="declined") location.href=pdfURL(f); }
});

// reveal on scroll
const io = "IntersectionObserver" in window ? new IntersectionObserver(es=>es.forEach(x=>{ if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target);} }),{threshold:.12}) : null;
document.querySelectorAll(".rv").forEach(el=> io? io.observe(el) : el.classList.add("in"));
setTimeout(()=>document.querySelectorAll(".rv").forEach(el=>el.classList.add("in")),2500);
</script>
